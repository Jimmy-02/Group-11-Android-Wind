name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 secret"
            exit 1
          fi

          echo "$FIREBASE_CONFIG" | base64 --decode > app/google-services.json

          test -s app/google-services.json
          echo "Firebase configuration created successfully."

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate SHA-256 Checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SciShare ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256